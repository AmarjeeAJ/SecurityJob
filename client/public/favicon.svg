<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Ring / Swoosh -->
  <path d="M 50,380 C 10,480 180,420 300,340 C 420,260 500,160 480,240 C 460,320 340,430 180,410 C 100,400 60,370 50,380 Z" fill="url(#cyanGrad)" opacity="0.9" />

  <!-- Shield Outer Border -->
  <path d="M 256,30 L 440,90 C 440,290 350,420 256,470 C 162,420 72,290 72,90 Z" fill="url(#cyanGrad)" filter="url(#glow)" />

  <!-- Shield Inner Body -->
  <path d="M 256,54 L 418,106 C 418,276 340,390 256,438 C 172,390 94,276 94,106 Z" fill="url(#shieldGrad)" />

  <!-- Stars -->
  <g fill="#38bdf8">
    <!-- Center Star -->
    <polygon points="256,92 263,110 282,110 267,121 273,138 256,127 239,138 245,121 230,110 249,110" />
    <!-- Left Star -->
    <polygon points="200,116 205,130 219,130 208,138 212,151 200,143 188,151 192,138 181,130 195,130" transform="scale(0.8) translate(50, 20)" />
    <!-- Right Star -->
    <polygon points="312,116 317,130 331,130 320,138 324,151 312,143 300,151 304,138 293,130 307,130" transform="scale(0.8) translate(78, 20)" />
  </g>

  <!-- Monogram SJ -->
  <!-- 'S' Letter -->
  <path d="M 240,165 L 155,165 L 140,240 L 225,245 C 240,246 248,255 245,268 C 242,282 230,290 210,290 L 130,290 L 122,330 L 215,330 C 260,330 285,302 292,265 C 298,230 278,212 245,208 L 175,202 L 180,195 L 246,195 Z" fill="#ffffff" />
  
  <!-- 'J' Letter -->
  <path d="M 285,165 L 370,165 L 360,215 L 330,215 L 315,305 C 310,330 285,340 255,335 L 260,295 C 275,298 285,292 288,280 L 302,195 L 285,195 Z" fill="url(#cyanGrad)" />

  <!-- Security Tie -->
  <polygon points="244,350 268,350 274,420 256,446 238,420" fill="#ffffff" />
  <polygon points="240,340 272,340 268,350 244,350" fill="#38bdf8" />
</svg>
